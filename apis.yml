name: Spocket
description: Spocket is a dropshipping platform that connects online retailers with vetted US and EU
  suppliers to source, import, and sell products with faster shipping. It provides automated order
  fulfillment, real-time inventory and price sync, branded invoicing, and one-click product import
  into e-commerce stores through prebuilt platform integrations for Shopify, WooCommerce, Wix,
  BigCommerce, Squarespace, Ecwid, Amazon, and eBay. Spocket serves over 500,000 entrepreneurs. At
  the time of profiling it publishes no public developer API or developer program; connectivity is
  delivered through its platform-specific storefront apps rather than a documented REST API.
