name: Spocket
description: >-
  Agent-native deployment/hosting platform. An AI coding agent ships a folder over MCP and it runs 24/7 with HTTPS URLs
  and custom domains. Supports Discord/Slack/Telegram/Twitch bots, web apps/APIs, static sites, scrapers, queue
  consumers and cron jobs on Node 22 and Python 3.11. No CLI, Dockerfile, or YAML.
